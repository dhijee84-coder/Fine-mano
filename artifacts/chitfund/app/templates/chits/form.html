{% extends "base.html" %}
{% block title %}New Chit Scheme{% endblock %}
{% block content %}
<h2>New Chit Scheme</h2>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <label>Name</label><input type="text" name="name" required>
  <label>Total amount</label><input type="number" step="0.01" name="total_amount" required>
  <label>Duration (months)</label><input type="number" name="duration_months" required>
  <label>Installment amount</label><input type="number" step="0.01" name="installment_amount" required>
  <label>Start date</label><input type="date" name="start_date" required>
  <button type="submit">Create</button>
</form>
{% endblock %}
