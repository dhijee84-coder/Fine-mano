{% extends "base.html" %}
{% block title %}Unmatched Payments{% endblock %}
{% block content %}
<h2>Unmatched Payments</h2>
<table>
<thead><tr><th>Amount</th><th>Source</th><th>Reference</th><th>Received</th></tr></thead>
<tbody>
{% for u in items %}
<tr><td>{{ u.amount }}</td><td>{{ u.source }}</td><td>{{ u.raw_reference }}</td><td>{{ u.received_at }}</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
