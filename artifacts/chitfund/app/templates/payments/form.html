{% extends "base.html" %}
{% block title %}Record Payment{% endblock %}
{% block content %}
<h2>Record Manual Payment</h2>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <label>Member ID</label><input type="number" name="member_id" required>
  <label>Amount</label><input type="number" step="0.01" name="amount" required>
  <label>Reference</label><input type="text" name="reference">
  <button type="submit">Save</button>
</form>
{% endblock %}
