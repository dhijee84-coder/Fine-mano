{% extends "base.html" %}
{% block title %}{{ member.full_name }}{% endblock %}
{% block content %}
<h2>{{ member.full_name }}</h2>
<div class="card">
<p>Phone: {{ member.phone }}</p>
<p>Email: {{ member.email }}</p>
<p>Address: {{ member.address }}</p>
</div>
{% if current_user.has_permission("members.delete") %}
<form method="post" action="{{ url_for("members.delete_member", member_id=member.id) }}">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
<label>Reason for deletion (required)</label><input type="text" name="reason" required>
<button class="danger" type="submit">Delete member (soft delete)</button>
</form>
{% endif %}
{% endblock %}
