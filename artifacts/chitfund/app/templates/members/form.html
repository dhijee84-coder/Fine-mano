{% extends "base.html" %}
{% block title %}{{ "Edit" if member else "New" }} Member{% endblock %}
{% block content %}
<h2>{{ "Edit" if member else "New" }} Member</h2>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <label>Full name</label><input type="text" name="full_name" value="{{ member.full_name if member else "" }}" required>
  <label>Phone</label><input type="text" name="phone" value="{{ member.phone if member else "" }}" required>
  <label>Email</label><input type="email" name="email" value="{{ member.email if member else "" }}">
  <label>Address</label><input type="text" name="address" value="{{ member.address if member else "" }}">
  <button type="submit">Save</button>
</form>
{% endblock %}
