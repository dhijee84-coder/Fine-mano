{% extends "base.html" %}
{% block title %}Menu Builder{% endblock %}
{% block content %}
<h2>Menu / Dashboard Builder</h2>
<table>
<thead><tr><th>Order</th><th>Label</th><th>URL</th><th>Required permission</th></tr></thead>
<tbody>
{% for i in items %}
<tr><td>{{ i.order_index }}</td><td>{{ i.label }}</td><td>{{ i.url }}</td><td>{{ i.required_permission or "—" }}</td></tr>
{% endfor %}
</tbody>
</table>
<h3>Add menu item</h3>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <label>Label</label><input type="text" name="label" required>
  <label>URL</label><input type="text" name="url" required>
  <label>Order</label><input type="number" name="order_index" value="0">
  <label>Required permission (optional)</label><input type="text" name="required_permission">
  <button type="submit">Add</button>
</form>
{% endblock %}
