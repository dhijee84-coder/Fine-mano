{% extends "base.html" %}
{% block title %}Notification Settings{% endblock %}
{% block content %}
<h2>Notification Configuration</h2>
<p>Provider passwords/API keys are configured via environment variables, never shown here.</p>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  {% for key in keys %}
    <label>{{ key.replace("_"," ").title() }}</label>
    <input type="text" name="{{ key }}" value="{{ settings.get(key, "") }}">
  {% endfor %}
  <button type="submit">Save</button>
</form>
{% endblock %}
