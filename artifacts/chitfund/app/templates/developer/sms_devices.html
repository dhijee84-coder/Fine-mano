{% extends "base.html" %}
{% block title %}SMS Devices{% endblock %}
{% block content %}
<h2>SMS Collector Devices</h2>
<table>
<thead><tr><th>Device</th><th>Status</th><th>Last sync</th><th>Action</th></tr></thead>
<tbody>
{% for d in devices %}
<tr><td>{{ d.device_name }}</td><td>{{ d.status }}</td><td>{{ d.last_sync_at or "never" }}</td>
<td>
<form class="inline" method="post">
<input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
<input type="hidden" name="device_id" value="{{ d.id }}"/>
<button name="action" value="approve" type="submit">Approve</button>
<button name="action" value="disable" type="submit" class="danger">Disable</button>
</form>
</td></tr>
{% endfor %}
</tbody>
</table>
{% endblock %}
