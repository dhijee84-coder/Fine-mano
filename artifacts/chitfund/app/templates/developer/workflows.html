{% extends "base.html" %}
{% block title %}Workflow Settings{% endblock %}
{% block content %}
<h2>Workflow Settings</h2>
{% for key in keys %}
<div class="card">
  <h4>{{ key.replace("_"," ").title() }}</h4>
  <pre>{{ settings.get(key, "{}") }}</pre>
</div>
{% endfor %}
<h3>Update a workflow</h3>
<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>
  <label>Key</label>
  <select name="key">{% for k in keys %}<option value="{{ k }}">{{ k }}</option>{% endfor %}</select>
  <label>Config (JSON)</label>
  <textarea name="config_json" rows="4">{}</textarea>
  <button type="submit">Save</button>
</form>
{% endblock %}
